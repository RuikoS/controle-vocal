# Mémoire allouée au démon Gradle + encodage UTF-8 (obligatoire pour les accents en Kotlin).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compilation plus rapide : cache et exécution parallèle.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX obligatoire pour Jetpack Compose.
android.useAndroidX=true

# Chaque module ne génère que ses propres ressources (build plus rapide).
android.nonTransitiveRClass=true

# Style de code officiel Kotlin.
kotlin.code.style=official

# KSP (le générateur de code de Room) déclare encore ses sources via
# kotlin.sourceSets, ce que le Kotlin intégré d'AGP 9 refuse par défaut.
# Ce drapeau rétablit la tolérance ; il pourra être retiré quand KSP sera
# aligné sur le nouveau DSL d'AGP.
android.disallowKotlinSourceSets=false
